<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meen Atchara - Portfolio</title>
    <meta name="description" content="">
    <meta name="theme-color" content="#16181b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181b'/%3E%3Cpath d='M12.5 6.5 10.5 25.5M21.5 6.5 19.5 25.5M6 12h20M5 20h20' stroke='%23e8402f' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">

    <style>
        /* ==========================================================
           1) ธีม  แก้สี/ตัวอักษรหลักของทั้งเว็บที่บล็อกนี้ที่เดียว
              (สีหลักเปลี่ยนได้จากหลังบ้านด้วย: ตั้งค่าทั่วไป > สีหลักของเว็บ)
           ========================================================== */
        :root {
            --bg: #16181b;           /* พื้นหลังหลัก (สีแอสฟอลต์) */
            --surface: #1e2125;      /* พื้นของแถบสลับ */
            --surface-2: #292d32;    /* พื้นของชิ้นส่วนเล็ก */
            --line: #33383f;         /* เส้นบาง */
            --text: #f2efe9;
            --muted: #a9aeb5;
            --accent: #d83a2b;       /* สีหลัก (ไฟเบรก) ใช้เป็นพื้นปุ่ม */
            --accent-hi: #ff6b57;    /* สีหลักแบบสว่าง ใช้กับตัวอักษรบนพื้นมืด */
            --on-accent: #ffffff;    /* สีตัวอักษรบนพื้นสีหลัก */
            --road: #c9972e;         /* เส้นกลางถนนในส่วน Experience */
            --card: var(--surface);

            --font-display: 'Chakra Petch', 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
            --font-body: 'IBM Plex Sans Thai', 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;

            --header-h: 4.25rem;
            --gutter: clamp(1.25rem, 4vw, 3rem);
            --maxw: 76rem;
            --r-sm: 0.6rem;
            --r-md: 0.9rem;
            --r-lg: 1.4rem;
        }

        /* ==========================================================
           2) พื้นฐาน  ขนาดตัวอักษรหลักขยายตามความกว้างจอ (16px -> 22px)
              ทุกอย่างใช้หน่วย rem จึงสเกลตามกันทั้งหน้า ไม่ดูเล็กบนจอใหญ่
           ========================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        html {
            font-size: clamp(16px, 0.55rem + 0.6vw, 22px);
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--header-h) + 1.5rem);
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            overflow-x: clip;
        }
        h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
        p, ul, ol, figure { margin: 0; }
        p { text-wrap: pretty; overflow-wrap: anywhere; }
        ul, ol { padding: 0; list-style: none; }
        a { color: inherit; }
        img { display: block; max-width: 100%; }
        button { font: inherit; color: inherit; }
        ::selection { background: var(--accent); color: var(--on-accent); }
        :focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px; border-radius: 0.25rem; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        .pre { white-space: pre-line; }
        .icon { width: 1.25em; height: 1.25em; flex: none; }

        .skip { position: absolute; left: -999rem; top: 1rem; z-index: 100; padding: 0.6rem 1rem; background: var(--text); color: var(--bg); border-radius: var(--r-sm); text-decoration: none; }
        .skip:focus { position: fixed; left: 1rem; }

        .wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
        .section { padding-block: clamp(4rem, 2.4rem + 6vw, 8.5rem); }
        .band { background: var(--surface); --card: var(--bg); }
        .h2 { font-size: clamp(1.875rem, 1.2rem + 2.4vw, 3.25rem); line-height: 1.15; }

        /* ==========================================================
           3) หัวเว็บ + เมนู
           ========================================================== */
        .site-header { position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--header-h); background: rgba(22, 24, 27, 0.78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color 0.25s, background 0.25s; }
        .site-header.is-scrolled { border-bottom-color: var(--line); background: rgba(22, 24, 27, 0.92); }
        .header-row { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .brand { display: flex; align-items: center; gap: 0.55rem; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; letter-spacing: 0.04em; text-decoration: none; }
        .brand-mark { color: var(--accent-hi); }
        .brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav { display: none; gap: 0.25rem; }
        .nav a { padding: 0.45rem 0.85rem; border-radius: 999px; font-size: 0.9375rem; line-height: 1.5; color: var(--muted); text-decoration: none; transition: color 0.2s, background 0.2s; }
        .nav a:hover { color: var(--text); }
        .nav a[aria-current="true"] { color: var(--text); background: var(--surface-2); }
        .menu-btn { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; margin-right: -0.6rem; border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; }
        .menu-btn:hover { background: var(--surface); }
        .menu-btn svg { width: 1.5rem; height: 1.5rem; }
        .mobile-nav { position: absolute; top: 100%; left: 0; right: 0; padding: 0.25rem var(--gutter) 1rem; background: rgba(22, 24, 27, 0.98); border-bottom: 1px solid var(--line); }
        .mobile-nav a { display: flex; align-items: center; min-height: 3.25rem; border-bottom: 1px solid var(--line); font-size: 1.0625rem; text-decoration: none; }
        .mobile-nav a:last-child { border-bottom: 0; }
        .mobile-nav a[aria-current="true"] { color: var(--accent-hi); }
        @media (min-width: 64rem) {
            .nav { display: flex; }
            .menu-btn, .mobile-nav { display: none; }
        }

        /* ==========================================================
           4) ปุ่ม / ไอคอนโซเชียล
           ========================================================== */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem; min-height: 3rem; padding: 0.55rem 1.5rem; border: 1.5px solid transparent; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.3; text-decoration: none; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; }
        .btn--primary { background: var(--accent); color: var(--on-accent); }
        .btn--primary:hover { background: color-mix(in srgb, var(--accent) 82%, white); }
        .btn--ghost { border-color: var(--line); color: var(--text); }
        .btn--ghost:hover { border-color: var(--accent-hi); color: var(--accent-hi); }
        .btn--dark { background: #16181b; color: #f2efe9; }
        .btn--dark:hover { background: #000; }
        .btn--sm { min-height: 2.5rem; padding: 0.3rem 1.1rem; font-size: 0.9375rem; }
        .btn--accent { border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--accent-hi); }
        .btn--accent:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
        .btn .icon { width: 1.1em; height: 1.1em; }
        .social { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .social-btn { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 1.5px solid var(--line); border-radius: 50%; color: var(--muted); transition: color 0.2s, border-color 0.2s; }
        .social-btn:hover { color: var(--accent-hi); border-color: var(--accent-hi); }

        /* ==========================================================
           5) Hero  (ภาพเปิดหน้า: ชื่อใหญ่ + รูป)
           ========================================================== */
        .hero { display: flex; align-items: center; min-height: min(100svh, 62rem); padding-top: calc(var(--header-h) + clamp(2rem, 5vw, 5rem)); padding-bottom: clamp(3rem, 6vw, 6rem); }
        .hero-grid { display: grid; gap: 2.75rem; align-items: center; }
        .hero-copy { min-width: 0; }
        .pill { display: inline-flex; align-items: center; max-width: 100%; padding: 0.3rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 0.9375rem; line-height: 1.6; }
        .hero-name { margin-top: 1.25rem; font-size: clamp(2.75rem, 1.4rem + 5.6vw, 6rem); line-height: 1.12; letter-spacing: -0.01em; }
        .hero-intro { max-width: 34rem; margin-top: 1.5rem; color: var(--muted); font-size: clamp(1.0625rem, 1rem + 0.35vw, 1.3125rem); line-height: 1.8; }
        .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.9rem 1rem; margin-top: 2.25rem; }
        .hero-actions .social { margin-left: 0.5rem; }
        .note { max-width: 34rem; margin-top: 2.75rem; padding-left: 1.15rem; border-left: 3px solid var(--accent); }
        .note-title { font-size: 1.0625rem; font-weight: 600; }
        .note p { margin-top: 0.3rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.75; }

        .hero-photo { position: relative; order: -1; width: min(100%, 15.5rem); justify-self: start; }
        .hero-photo::before { content: ""; position: absolute; inset: 0; transform: translate(0.85rem, 0.85rem); border: 2px solid var(--accent); border-radius: var(--r-lg); }
        .photo-frame { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--r-lg); background: var(--surface-2); }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
        .photo-fallback { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 6rem; color: var(--accent-hi); }
        @media (min-width: 64rem) {
            .hero-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(3rem, 6vw, 6rem); }
            .hero-photo { order: 0; width: 100%; max-width: 26rem; justify-self: end; }
            .hero-photo::before { transform: translate(1.1rem, 1.1rem); }
        }

        /* ==========================================================
           6) แบบแบ่งสองคอลัมน์: หัวข้อซ้าย (ค้างตามเลื่อน) / เนื้อหาขวา
           ========================================================== */
        .split { display: grid; gap: 2.25rem; }
        .split-body { min-width: 0; }
        @media (min-width: 60rem) {
            .split { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: clamp(2.5rem, 6vw, 6rem); }
            .split-head { position: sticky; top: calc(var(--header-h) + 2rem); align-self: start; }
        }

        /* Experience: เส้นกลางถนน */
        .road-item { position: relative; padding: 0 0 2.4rem 2.25rem; }
        .road-item:last-child { padding-bottom: 0; }
        .road-item:not(:last-child)::before { content: ""; position: absolute; left: 0.43rem; top: 1.35rem; bottom: -0.2rem; width: 3px; background: repeating-linear-gradient(to bottom, var(--road) 0 0.8rem, transparent 0.8rem 1.4rem); opacity: 0.75; }
        .road-dot { position: absolute; left: 0; top: 0.45rem; width: 1rem; height: 1rem; border: 3px solid var(--road); border-radius: 50%; background: var(--bg); }
        .road-item.is-current .road-dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--accent) 28%, transparent); }
        .road-period { font-family: var(--font-display); font-weight: 600; font-size: 0.9375rem; color: var(--accent-hi); line-height: 1.6; }
        .road-title { margin-top: 0.1rem; font-size: clamp(1.125rem, 1rem + 0.5vw, 1.5rem); line-height: 1.35; }
        .road-co { margin-top: 0.3rem; color: var(--muted); }

        /* Education: แถวแบบ CV */
        .row { display: grid; gap: 0.35rem 2rem; padding-block: 1.75rem; border-top: 1px solid var(--line); }
        .row:last-child { border-bottom: 1px solid var(--line); }
        .row-meta { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
        .row-level { font-family: var(--font-display); font-weight: 600; color: var(--accent-hi); line-height: 1.5; }
        .row-years { color: var(--muted); font-size: 0.9375rem; }
        .row-title { font-size: clamp(1.125rem, 1rem + 0.5vw, 1.5rem); line-height: 1.35; }
        .row-school { margin-top: 0.3rem; color: var(--muted); }
        @media (min-width: 40rem) {
            .row { grid-template-columns: minmax(9rem, 0.34fr) minmax(0, 1fr); }
        }

        /* Skills: กล่องทักษะ */
        .tiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
        .tile { min-width: 0; padding: 1.6rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card); transition: border-color 0.25s; }
        .tile:hover { border-color: var(--accent); }
        .tile-icon { display: grid; place-items: center; width: 2.9rem; height: 2.9rem; margin-bottom: 1.15rem; border-radius: 0.75rem; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-hi); }
        .tile-icon { overflow: hidden; }
        .tile-icon .icon { width: 1.5rem; height: 1.5rem; }
        .tile-icon img { width: 100%; height: 100%; padding: 0.5rem; object-fit: contain; }
        .tile-title { font-size: 1.1875rem; line-height: 1.35; }
        .tile-desc { margin-top: 0.5rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.75; }

        /* ==========================================================
           7) Hobbies  (แท็บ + รูปจัดเรียงอัตโนมัติตามจำนวน)
           ========================================================== */
        .hob-title { font-size: clamp(2.75rem, 1.2rem + 6vw, 6rem); line-height: 1.1; letter-spacing: -0.01em; }
        .hob-title span:last-child { color: var(--muted); }
        .hob-sub { margin-top: 0.9rem; color: var(--muted); font-size: 1.0625rem; }
        .tabs { position: relative; display: flex; gap: 0.6rem; margin: 2.5rem calc(var(--gutter) * -1) 0; padding: 0.3rem var(--gutter); overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { flex: none; min-height: 2.9rem; padding: 0.4rem 1.2rem; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-weight: 500; line-height: 1.4; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; }
        .tab:hover { color: var(--text); border-color: var(--muted); }
        .tab[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
        .hob-panel { display: grid; gap: clamp(1.5rem, 3vw, 3rem); align-items: center; margin-top: 2rem; }
        .hob-name { font-size: clamp(1.75rem, 1.2rem + 1.8vw, 2.75rem); line-height: 1.25; }
        .hob-desc { max-width: 30rem; margin-top: 1rem; color: var(--muted); font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem); line-height: 1.8; }
        .hob-panel.is-swapped { animation: fade 0.4s ease both; }
        @media (min-width: 60rem) {
            .hob-panel { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
        }
        .gal { display: grid; gap: 0.75rem; grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 0; }
        .gal-item { margin: 0; overflow: hidden; border-radius: var(--r-md); background: var(--surface-2); aspect-ratio: 4 / 3; }
        .gal-item img { width: 100%; height: 100%; object-fit: cover; }
        .gal--1 { grid-template-columns: minmax(0, 1fr); }
        .gal--1 .gal-item { aspect-ratio: 16 / 10; }
        .gal--2 .gal-item { aspect-ratio: 4 / 5; }
        .gal--3 .gal-item:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
        .gal--empty .gal-item { display: grid; place-items: center; aspect-ratio: 16 / 10; font-size: clamp(4.5rem, 3rem + 7vw, 9rem); line-height: 1; }
        .gal--empty .icon { width: 30%; height: 30%; color: var(--muted); }
        .gal-item--empty { display: grid; place-items: center; color: var(--muted); }
        .gal-item--empty .icon { width: 2.5rem; height: 2.5rem; opacity: 0.7; }

        /* ==========================================================
           8) Projects
           ========================================================== */
        .proj-head { margin-bottom: clamp(2rem, 4vw, 3.5rem); }
        .cards { display: grid; gap: clamp(1.25rem, 2.5vw, 2rem); grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
        .cards > :only-child { max-width: 42rem; }
        .card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); transition: border-color 0.25s; }
        .card:hover { border-color: var(--accent); }
        .card-media { display: grid; place-items: center; aspect-ratio: 16 / 10; background: var(--surface-2); color: var(--muted); }
        .card-media--empty { aspect-ratio: 21 / 9; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-media .icon { width: 3rem; height: 3rem; opacity: 0.7; }
        .card-body { display: flex; flex: 1; flex-direction: column; padding: clamp(1.4rem, 2vw, 2rem); }
        .card-cat { color: var(--accent-hi); font-weight: 600; font-size: 0.9375rem; line-height: 1.5; }
        .card-title { margin-top: 0.3rem; font-size: clamp(1.25rem, 1.05rem + 0.8vw, 1.75rem); line-height: 1.3; }
        .card-desc { margin-top: 0.75rem; color: var(--muted); }
        .card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem; margin-top: auto; padding-top: 1.5rem; }
        .chip { padding: 0.15rem 0.8rem; border-radius: 999px; background: var(--surface-2); color: var(--text); font-size: 0.875rem; line-height: 1.7; }

        /* Certificates */
        .certs { display: grid; gap: clamp(1.25rem, 2.5vw, 2rem); grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); }
        .cert { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); transition: border-color 0.25s; }
        .cert:hover { border-color: var(--accent); }
        .cert-media { display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0.75rem; border: 0; background: var(--surface-2); cursor: zoom-in; }
        .cert-media img { width: 100%; height: 100%; object-fit: contain; }
        .cert-media--empty { display: grid; place-items: center; color: var(--muted); cursor: default; }
        .cert-media--empty .icon { width: 3rem; height: 3rem; opacity: 0.7; }
        .cert-body { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 0.2rem; padding: 1.25rem 1.4rem 1.5rem; }
        .cert-title { font-size: 1.1875rem; line-height: 1.35; }
        .cert-issuer { color: var(--accent-hi); font-weight: 600; font-size: 0.9375rem; }
        .cert-date { color: var(--muted); font-size: 0.875rem; }
        .cert-desc { margin-top: 0.5rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.75; }
        .cert-link { margin-top: 1rem; }

        /* ดูรูปขยาย */
        .lightbox { width: fit-content; max-width: 96vw; max-height: 94vh; padding: 0; border: 0; background: transparent; color: var(--text); overflow: visible; }
        .lightbox::backdrop { background: rgba(10, 11, 13, 0.88); }
        .lightbox figure { margin: 0; }
        .lightbox img { width: auto; height: auto; max-width: 96vw; max-height: 82vh; margin-inline: auto; border-radius: var(--r-md); background: #fff; }
        .lightbox figcaption { margin-top: 0.9rem; text-align: center; font-family: var(--font-display); font-weight: 600; }
        .lightbox-close { position: absolute; top: 0.6rem; right: 0.6rem; z-index: 1; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); cursor: pointer; }
        .lightbox-close svg { width: 1.25rem; height: 1.25rem; }
        body:has(dialog[open]) { overflow: hidden; }

        /* ==========================================================
           9) Contact (แถบสีหลักเต็มความกว้าง) + Footer
           ========================================================== */
        .contact { background: var(--accent); color: var(--on-accent); }
        .contact :focus-visible { outline-color: var(--on-accent); }
        .contact-grid { display: grid; gap: 2.5rem; align-items: end; }
        .contact-title { font-size: clamp(2.25rem, 1.1rem + 4.4vw, 4.75rem); line-height: 1.12; }
        .contact-intro { max-width: 32rem; margin-top: 1.25rem; font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem); }

        const BRAND_HOSTS = [
            [/(^|\.)facebook\.com$|(^|\.)fb\.(com|me)$/, 'facebook'],
            [/(^|\.)youtube\.com$|(^|\.)youtu\.be$/, 'youtube'],
            [/(^|\.)tiktok\.com$/, 'tiktok'],
            [/(^|\.)instagram\.com$/, 'instagram'],
            [/(^|\.)github\.com$/, 'github'],
            [/(^|\.)line\.me$|(^|\.)lin\.ee$/, 'line'],
            [/(^|\.)x\.com$|(^|\.)twitter\.com$/, 'x'],
            [/(^|\.)discord\.(gg|com)$/, 'discord'],
            [/(^|\.)twitch\.tv$/, 'twitch']
        ];
        const icon = (name) =>
            `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name] || ICONS.spark}</svg>`;
        function linkIcon(url) {
            let host = '';
            try { host = new URL(url, location.href).hostname.toLowerCase(); } catch (e) { /* ไม่ใช่ URL */ }
            for (const [re, key] of BRAND_HOSTS) {
                if (re.test(host) && BRANDS[key]) {
                    return `<svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="${BRANDS[key]}"/></svg>`;
                }
            }
            return icon('globe');
        }

        // ---------- สีหลักที่ตั้งจากหลังบ้าน ----------
        function applyAccent(hex) {
            if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;
            const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
            const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
            const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
            const mix = (t) => rgb.map((v) => Math.round(v + (255 - v) * t));
            const BG_L = 0.009; // ความสว่างของพื้นหลัง #16181b
            let hi = rgb;
            for (let t = 0; t <= 1; t += 0.05) {
                hi = mix(t);
                if ((lum(hi) + 0.05) / (BG_L + 0.05) >= 5) break;
            }
            const s = document.documentElement.style;
            s.setProperty('--accent', hex);
            s.setProperty('--accent-hi', `rgb(${hi.join(',')})`);
            s.setProperty('--on-accent', 1.05 / (lum(rgb) + 0.05) >= 4.5 ? '#ffffff' : '#16181b');
        }

        // ---------- แต่ละส่วนของหน้า ----------
        function renderSettings(s) {
            document.title = s.pageTitle || document.title;
            if (s.description) document.querySelector('meta[name="description"]').content = s.description;
            applyAccent(s.accent);
            setText('brand-name', s.brandName);
            setText('site-footer', s.footer);
            const h = s.headings || {};
            setText('experience-title', h.experience || 'ประสบการณ์การทำงาน');
            setText('education-title', h.education || 'การศึกษา');
            setText('skills-title', h.skills || 'ทักษะและความถนัด');
            setText('projects-title', h.projects || 'ตัวอย่างผลงาน');
            setText('certificates-title', h.certificates || 'ใบรับรองและประกาศนียบัตร');
            setText('contact-title', h.contact || 'ช่องทางการติดต่อ');
            setText('cta-primary', s.ctaPrimary || 'ติดต่อ');
            setText('cta-secondary', s.ctaSecondary || 'ดูผลงาน');
        }

        function renderHome(h, contact) {
            setText('home-badge', h.badge);
            if (!h.badge) $('home-badge').hidden = true;
            setText('home-name', h.name);
            setText('home-intro', h.intro);
            if (h.strengthsText || h.strengthsTitle) {
                setText('home-strengths-title', h.strengthsTitle);
                setText('home-strengths-text', h.strengthsText);
            } else {
                $('home-note').hidden = true;
            }

            const frame = $('hero-frame');
            const fallback = () => frame.insertAdjacentHTML('beforeend',
                `<span class="photo-fallback" aria-hidden="true">${esc((h.name || '').trim().charAt(0).toUpperCase())}</span>`);
            const src = safeUrl(h.profileImage);
            if (src) {
                const img = new Image();
                img.alt = h.name || '';
                img.decoding = 'async';
                img.fetchPriority = 'high';
                img.addEventListener('error', () => { img.remove(); fallback(); });
                img.src = src;
                frame.prepend(img);
            } else {
                fallback();
            }

            $('hero-social').innerHTML = (contact.links || []).map((l) => {
                const url = safeUrl(l.url);
                return url ? `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(l.label)}" title="${esc(l.label)}">${linkIcon(url)}</a>` : '';
            }).join('');
        }

        function renderExperience(data) {
            $('experience-list').innerHTML = itemsOf(data).map((it) => `
                <li class="road-item${it.current ? ' is-current' : ''}">
                    <span class="road-dot" aria-hidden="true"></span>
                    ${it.period ? `<p class="road-period">${esc(it.period)}</p>` : ''}
                    <h3 class="road-title">${esc(it.title)}</h3>
                    <p class="road-co">${esc(it.company)}</p>
                </li>`).join('');
        }

        // รองรับทั้งช่อง "ช่วงปี" และกรณีพิมพ์ปีต่อท้ายชื่อหลักสูตรด้วย " | "
        function eduParts(it) {
            const parts = String(it.title ?? '').split(/\s+\|\s+/);
            return { title: parts[0], years: it.years || parts.slice(1).join(' | ') };
        }
        function renderEducation(data) {
            $('education-list').innerHTML = itemsOf(data).map((it) => {
                const { title, years } = eduParts(it);
                return `
                <li class="row">
                    <div class="row-meta">
                        <span class="row-level">${esc(it.level)}</span>
                        ${years ? `<span class="row-years">${esc(years)}</span>` : ''}
                    </div>
                    <div>
                        <h3 class="row-title">${esc(title)}</h3>
                        <p class="row-school">${esc(it.school)}</p>
                    </div>
                </li>`;
            }).join('');
        }

        const SKILL_ICONS = ['layers', 'check', 'wrench', 'database', 'code', 'terminal', 'chart', 'file', 'search', 'server', 'shield', 'cloud', 'sliders', 'bulb', 'target', 'mobile', 'palette', 'camera', 'users', 'globe', 'spark'];
        function skillIcon(it) {
            if (SKILL_ICONS.includes(it.icon)) return it.icon;
            const t = String(it.title || '').toLowerCase();
            if (/test|quality|qa/.test(t)) return 'check';
            if (/support|trouble|help|repair/.test(t)) return 'wrench';
            if (/database|report|data|sql/.test(t)) return 'database';
            if (/code|develop|program/.test(t)) return 'code';
            if (/server|network|infra/.test(t)) return 'server';
            if (/security|secure/.test(t)) return 'shield';
            if (/graphic|design|ui|ux/.test(t) && !/system/.test(t)) return 'palette';
            if (/system|analysis|analy/.test(t)) return 'layers';
            return 'spark';
        }
        function renderSkills(data) {
            $('skills-list').innerHTML = itemsOf(data).map((it) => {
                const img = safeUrl(it.iconImage);
                return `
                <li class="tile">
                    <span class="tile-icon">${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async">` : icon(skillIcon(it))}</span>
                    <h3 class="tile-title">${esc(it.title)}</h3>
                    <p class="tile-desc pre">${esc(it.desc)}</p>
                </li>`;
            }).join('');
        }

        const stripArrow = (t) => String(t || '').replace(/\s*[→➜➔›»>]+\s*$/u, '');
        function renderProjects(data) {
            const defaultLabel = stripArrow(data.linkLabel) || 'ดูตัวอย่างผลงาน';
            $('projects-list').innerHTML = itemsOf(data).map((it) => {
                const img = safeUrl(it.image);
                const link = safeUrl(it.link);
                const external = /^https?:/i.test(link);
                const label = stripArrow(it.linkLabel) || defaultLabel;
                return `
                <article class="card">
                    <div class="card-media${img ? '' : ' card-media--empty'}">${img
                        ? `<img src="${esc(img)}" alt="${esc(it.title)}" loading="lazy" decoding="async">`
                        : icon('window')}</div>
                    <div class="card-body">
                        ${it.category ? `<p class="card-cat">${esc(it.category)}</p>` : ''}
                        <h3 class="card-title">${esc(it.title)}</h3>
                        <p class="card-desc pre">${esc(it.desc)}</p>
                        <div class="card-foot">
                            ${it.tag ? `<span class="chip">${esc(it.tag)}</span>` : '<span></span>'}
                            ${link ? `<a class="btn btn--accent btn--sm" href="${esc(link)}"${external ? ' target="_blank" rel="noopener"' : ''}>${esc(label)}${icon('arrow')}</a>` : ''}
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        // ---------- Certificates + ดูรูปขยาย ----------
        let certItems = [];
        function renderCertificates(data) {
            certItems = itemsOf(data);
            $('certs-list').innerHTML = certItems.map((it, i) => {
                const img = safeUrl(it.image);
                const link = safeUrl(it.link);
                return `
                <article class="cert">
                    ${img
                        ? `<button class="cert-media" type="button" data-i="${i}" aria-label="ดูรูปขยาย: ${esc(it.title)}"><img src="${esc(img)}" alt="${esc(it.title)}" loading="lazy" decoding="async"></button>`
                        : `<div class="cert-media cert-media--empty">${icon('award')}</div>`}
                    <div class="cert-body">
                        <h3 class="cert-title">${esc(it.title)}</h3>
                        ${it.issuer ? `<p class="cert-issuer">${esc(it.issuer)}</p>` : ''}
                        ${it.date ? `<p class="cert-date">${esc(it.date)}</p>` : ''}
                        ${it.desc ? `<p class="cert-desc pre">${esc(it.desc)}</p>` : ''}
                        ${link ? `<a class="btn btn--accent btn--sm cert-link" href="${esc(link)}" target="_blank" rel="noopener">${esc(it.linkLabel || 'ตรวจสอบใบรับรอง')}${icon('arrow')}</a>` : ''}
                    </div>
                </article>`;
            }).join('');
        }
        function setupLightbox() {
            const dlg = $('lightbox');
            $('certs-list').addEventListener('click', (e) => {
                const b = e.target.closest('.cert-media[data-i]');
                if (!b) return;
                const it = certItems[+b.dataset.i];
                const src = safeUrl(it.image);
                if (typeof dlg.showModal !== 'function') { window.open(src, '_blank', 'noopener'); return; }
                $('lightbox-img').src = src;
                $('lightbox-img').alt = it.title || '';
                setText('lightbox-cap', it.title);
                dlg.showModal();
            });
            dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
            dlg.addEventListener('close', () => $('lightbox-img').removeAttribute('src'));
        }

        // รูปที่โหลดไม่ขึ้น (ลิงก์ผิด/ไฟล์หาย) ให้แสดงไอคอนแทนภาพแตก
        document.addEventListener('error', (e) => {
            const img = e.target;
            if (!(img instanceof HTMLImageElement)) return;
            const cm = img.closest('.card-media');
            const tm = img.closest('.cert-media');
            const ti = img.closest('.tile-icon');
            const gi = img.closest('.gal-item');
            if (cm) { cm.classList.add('card-media--empty'); cm.innerHTML = icon('window'); }
            else if (tm) { tm.classList.add('cert-media--empty'); tm.removeAttribute('data-i'); tm.innerHTML = icon('award'); }
            else if (ti) { ti.innerHTML = icon('spark'); }
            else if (gi) { gi.classList.add('gal-item--empty'); gi.innerHTML = icon('spark'); }
        }, true);

        function renderContact(c) {
            setText('contact-intro', c.intro);
            const mail = $('contact-mail');
            const actions = $('contact-actions');
            let html = '';
            if (c.email) {
                mail.href = 'mailto:' + c.email;
                mail.textContent = c.email;
                html += `<button class="btn btn--dark" id="copy-mail" type="button">${icon('copy')}<span aria-live="polite">คัดลอกอีเมล</span></button>`;
            } else {
                mail.hidden = true;
            }
            html += (c.links || []).map((l) => {
                const url = safeUrl(l.url);
                return url ? `<a class="btn btn--dark" href="${esc(url)}" target="_blank" rel="noopener">${linkIcon(url)}${esc(l.label)}</a>` : '';
            }).join('');
            actions.innerHTML = html;

            const btn = $('copy-mail');
            if (btn) {
                const label = btn.querySelector('span');
                btn.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(c.email);
                    } catch (e) {
                        const ta = document.createElement('textarea');
                        ta.value = c.email;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (err) { /* ไม่รองรับ */ }
                        ta.remove();
                    }
                    label.textContent = 'คัดลอกแล้ว';
                    clearTimeout(btn._t);
                    btn._t = setTimeout(() => { label.textContent = 'คัดลอกอีเมล'; }, 2000);
                });
            }
        }

        // ---------- Hobbies (แท็บ) ----------
        let hobbies = [];
        let hobbyIdx = 0;
        const EMOJI = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*/u;

        function galleryHtml(h) {
            const imgs = (h.images || []).map(safeUrl).filter(Boolean).slice(0, 4);
            if (!imgs.length) {
                const emoji = (String(h.title || '').match(EMOJI) || [''])[0];
                return `<div class="gal gal--1 gal--empty"><figure class="gal-item" aria-hidden="true">${emoji || icon('spark')}</figure></div>`;
            }
            return `<div class="gal gal--${imgs.length}">${imgs.map((src) =>
                `<figure class="gal-item"><img src="${esc(src)}" alt="${esc(h.title)}" loading="lazy" decoding="async"></figure>`).join('')}</div>`;
        }

        function showHobby(i, opts = {}) {
            const n = hobbies.length;
            hobbyIdx = (i + n) % n;
            const tabs = [...$('hobby-tabs').children];
            tabs.forEach((t, k) => {
                t.setAttribute('aria-selected', String(k === hobbyIdx));
                t.tabIndex = k === hobbyIdx ? 0 : -1;
            });
            const cur = hobbies[hobbyIdx];
            const panel = $('hobby-panel');
            panel.setAttribute('aria-labelledby', 'tab-' + hobbyIdx);
            panel.innerHTML = `
                <div>
                    <h3 class="hob-name">${esc(cur.title)}</h3>
                    <p class="hob-desc pre">${esc(cur.desc)}</p>
                </div>
                ${galleryHtml(cur)}`;
            if (opts.animate) {
                panel.classList.remove('is-swapped');
                void panel.offsetWidth;
                panel.classList.add('is-swapped');
            }
            const tab = tabs[hobbyIdx];
            const box = $('hobby-tabs');
            box.scrollTo({ left: tab.offsetLeft - (box.clientWidth - tab.offsetWidth) / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
            if (opts.focus) tab.focus();
        }

        function renderHobbies(d) {
            setText('hobbies-eyebrow', d.eyebrow);
            setText('hobbies-title1', d.titleLine1);
            setText('hobbies-title2', d.titleLine2);
            hobbies = itemsOf(d);
            const box = $('hobby-tabs');
            box.innerHTML = hobbies.map((h, i) =>
                `<button class="tab" role="tab" id="tab-${i}" aria-controls="hobby-panel" type="button" data-i="${i}">${esc(h.title)}</button>`).join('');
            box.addEventListener('click', (e) => {
                const t = e.target.closest('.tab');
                if (t) showHobby(+t.dataset.i, { animate: true });
            });
            box.addEventListener('keydown', (e) => {
                const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
                if (k) { e.preventDefault(); showHobby(hobbyIdx + k, { animate: true, focus: true }); }
                if (e.key === 'Home') { e.preventDefault(); showHobby(0, { animate: true, focus: true }); }
                if (e.key === 'End') { e.preventDefault(); showHobby(hobbies.length - 1, { animate: true, focus: true }); }
            });
            // ปัดซ้าย/ขวาบนมือถือเพื่อสลับงานอดิเรก
            const panel = $('hobby-panel');
            let sx = 0, sy = 0;
            panel.addEventListener('touchstart', (e) => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive: true });
            panel.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - sx;
                const dy = e.changedTouches[0].clientY - sy;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showHobby(hobbyIdx + (dx < 0 ? 1 : -1), { animate: true });
            }, { passive: true });
            showHobby(0);
        }

        // ---------- เมนูนำทาง ----------
        function setupNav(sections) {
            const nav = sections.map(([id, label]) => ({ id, label }));
            $('desktop-nav').innerHTML = nav.map((n) => `<a href="#${n.id}">${n.label}</a>`).join('');
            $('mobile-nav').innerHTML = nav.map((n) => `<a href="#${n.id}">${n.label}</a>`).join('');

            const btn = $('menu-btn');
            const panel = $('mobile-nav');
            const setOpen = (open) => {
                panel.hidden = !open;
                btn.setAttribute('aria-expanded', String(open));
                btn.setAttribute('aria-label', open ? 'ปิดเมนู' : 'เปิดเมนู');
                $('menu-icon').setAttribute('d', open ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16');
            };
            btn.addEventListener('click', () => setOpen(panel.hidden));
            panel.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { setOpen(false); btn.focus(); } });
            window.matchMedia('(min-width: 64rem)').addEventListener('change', (e) => { if (e.matches) setOpen(false); });

            // ไฮไลต์เมนูตามส่วนที่กำลังอ่าน
            const links = [...document.querySelectorAll('#desktop-nav a, #mobile-nav a')];
            const setActive = (id) => links.forEach((a) => {
                if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
                else a.removeAttribute('aria-current');
            });
            const io = new IntersectionObserver((entries) => {
                entries.forEach((en) => { if (en.isIntersecting) setActive(en.target.id); });
            }, { rootMargin: '-45% 0px -50% 0px' });
            nav.forEach((n) => io.observe($(n.id)));

            const header = $('site-header');
            const onScroll = () => {
                header.classList.toggle('is-scrolled', window.scrollY > 8);
                if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4 && nav.length) setActive(nav[nav.length - 1].id);
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }

        // ---------- เริ่มทำงาน ----------
        const NAMES = ['settings', 'home', 'hobbies', 'experience', 'education', 'skills', 'projects', 'contact', 'certificates'];
        const OPTIONAL = ['certificates']; // ไฟล์ที่ยังไม่มีได้ ไม่ต้องแจ้งเตือน
        const failed = [];
        const load = (name) => fetch(`content/${name}.json`, { cache: 'no-cache' })
            .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
            .catch(() => { if (!OPTIONAL.includes(name)) failed.push(name + '.json'); return {}; });

        Promise.all(NAMES.map(load)).then(([settings, home, hobbiesData, experience, education, skills, projects, contact, certificates]) => {
            renderSettings(settings);
            renderHome(home, contact);
            renderHobbies(hobbiesData);
            renderExperience(experience);
            renderEducation(education);
            renderSkills(skills);
            renderProjects(projects);
            renderContact(contact);
            renderCertificates(certificates);
            setupLightbox();

            // ส่วนไหนไม่มีข้อมูล ให้ซ่อนทั้งส่วนและซ่อนจากเมนู
            const has = {
                hobbies: itemsOf(hobbiesData).length,
                experience: itemsOf(experience).length,
                education: itemsOf(education).length,
                certificates: itemsOf(certificates).length,
                skills: itemsOf(skills).length,
                projects: itemsOf(projects).length,
                contact: contact.email || (contact.links || []).length || contact.intro
            };
            Object.keys(has).forEach((id) => { if (!has[id]) $(id).hidden = true; });
            if (!has.projects) $('cta-secondary').hidden = true;
            if (!has.contact) $('cta-primary').hidden = true;

            const LABELS = [['home', 'Home'], ['hobbies', 'Hobbies'], ['experience', 'Experience'], ['education', 'Education'], ['certificates', 'Certificates'], ['skills', 'Skills'], ['projects', 'Projects'], ['contact', 'Contact']];
            setupNav(LABELS.filter(([id]) => id === 'home' || has[id]));
            // สลับพื้นหลังเข้ม/อ่อนของแต่ละส่วนที่แสดงอยู่ให้เป็นจังหวะเดียวกัน
            ['hobbies', 'experience', 'education', 'certificates', 'skills', 'projects']
                .filter((id) => has[id])
                .forEach((id, i) => $(id).classList.toggle('band', i % 2 === 0));

            if (failed.length) {
                document.body.insertAdjacentHTML('afterbegin',
                    `<div class="banner" role="alert">โหลดเนื้อหาไม่สำเร็จ: ${esc(failed.join(', '))} (ถ้าเปิดไฟล์ตรง ๆ จากเครื่อง ให้รันผ่านเซิร์ฟเวอร์ เช่น npx serve)</div>`);
            }
            document.body.classList.replace('is-loading', 'is-ready');
        });
    })();
    </script>
</body>
</html>
